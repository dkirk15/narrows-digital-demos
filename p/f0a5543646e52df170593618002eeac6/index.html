<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fold expense tracker · Jan–Sep 2026</title>
<style>
  :root {
    --bg: #0b0f14;
    --bg-elev: #141a22;
    --bg-elev-2: #1c2430;
    --line: #2a3444;
    --text: #f4efe6;
    --muted: #9aa6b8;
    --accent: #e2b039;
    --accent-dim: #8a6a16;
    --neg: #ff7a6b;
    --pos: #4ee0a0;
    --chip: #243044;
    --chip-on: #e2b039;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --radius: 16px;
    --font: "Segoe UI", "Bahnschrift", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Mono", "Segoe UI Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(226,176,57,.12), transparent 50%),
      radial-gradient(900px 400px at 100% 0%, rgba(78,224,160,.06), transparent 45%),
      var(--bg);
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 28px 20px 64px; }
  header.hero {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 16px; margin-bottom: 28px; padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow {
    letter-spacing: .18em; text-transform: uppercase; font-size: 12px; color: var(--accent);
    font-weight: 600;
  }
  h1 {
    font-size: clamp(28px, 4vw, 42px); line-height: 1.1; margin: 6px 0 8px; font-weight: 650;
    letter-spacing: -0.03em;
  }
  .sub { color: var(--muted); font-size: 16px; max-width: 52ch; line-height: 1.45; }
  .meta {
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .pill {
    background: var(--bg-elev); border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 16px; font-size: 14px; color: var(--muted);
  }
  .pill strong { color: var(--text); font-weight: 600; }
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .card {
    background: linear-gradient(180deg, var(--bg-elev) 0%, #121820 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    min-height: 118px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .card .label { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  .card .value { font-size: 28px; font-weight: 650; letter-spacing: -0.03em; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .card .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .card.spend .value { color: var(--neg); }
  .card.income .value { color: var(--pos); }
  .card.gold { border-color: rgba(226,176,57,.35); }
  .card.gold .value { color: var(--accent); }
  .section {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .section h2 { margin: 0 0 6px; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
  .section p.note { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(110px, 160px) 1fr auto; gap: 12px; align-items: center; width: 100%; appearance: none; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: 10px; padding: 8px 8px; margin: 0 -8px; }
  .bar-row:hover, .bar-row:focus-visible { background: rgba(255,255,255,.05); outline: none; }
  .bar-row[aria-pressed="true"] { background: rgba(226,176,57,.14); }
  .bar-name { font-size: 14px; color: var(--text); }
  .bar-track { height: 18px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #c4921c, var(--accent)); border-radius: 999px; min-width: 4px; }
  .bar-row.sub .bar-fill { background: linear-gradient(90deg, #2f6f96, #8ec8ff); }
  .bar-amt { font-family: var(--mono); font-size: 13px; color: var(--muted); min-width: 92px; text-align: right; }
  .drill { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .drill-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .drill-head h3 { margin: 4px 0 0; font-size: 16px; font-weight: 650; }
  .crumb { color: var(--muted); font-size: 13px; }
  .crumb button { appearance: none; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px;
    position: sticky; top: 0; z-index: 5; padding: 12px 0; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
  }
  .chip-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
  .chip-label { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; min-width: 58px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .month-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; margin: -8px 0 22px; }
  .chip {
    appearance: none; border: 1px solid var(--line); background: var(--chip); color: var(--text);
    border-radius: 999px; padding: 12px 18px; font-size: 15px; min-height: 44px; cursor: pointer;
    font-family: inherit;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: #1a1406; border-color: var(--accent); font-weight: 650; }
  .search {
    flex: 1; min-width: 220px;
  }
  .search input {
    width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 16px; padding: 12px 16px; font-family: inherit;
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .count { color: var(--muted); font-size: 14px; }
  .table-wrap { overflow: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 15px; }
  th {
    position: sticky; top: 0; background: var(--bg-elev-2); color: var(--muted);
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600;
  }
  tr:hover td { background: rgba(255,255,255,.03); }
  td.amt { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  td.amt.neg { color: var(--neg); }
  td.amt.pos { color: var(--pos); }
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px;
    background: var(--bg); border: 1px solid var(--line); color: var(--muted);
  }
  .badge.credit { color: var(--accent); border-color: rgba(226,176,57,.4); }
  .badge.debit { color: #8ec8ff; border-color: rgba(142,200,255,.35); }
  .cat { color: var(--muted); font-size: 13px; }
  footer.foot {
    color: var(--muted); font-size: 14px; line-height: 1.55; margin-top: 8px;
  }
  footer.foot code { color: var(--text); font-family: var(--mono); font-size: 12px; }
  @media (max-width: 640px) {
    .bar-row { grid-template-columns: 1fr; gap: 4px; }
    .bar-amt { text-align: left; }
    .card .value { font-size: 24px; }
  }
</style>
</head>

</div>

const FILTERS = [
  { id: "all", label: "All" },
  { id: "credit", label: "Credit" },
  { id: "debit", label: "Debit" },
  { id: "spend", label: "Spend" },
  { id: "transfers", label: "Transfers" }
];
// Cycle/coverage copy, month list, and spend rule all come from the build (DATA.summary.ui / spend_rule).
const UI = DATA.summary.ui || {};
const SPEND_RULE = DATA.summary.spend_rule || null;
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS = (UI.month_chips && UI.month_chips.length)
  ? UI.month_chips
  : [{ id: "all", label: "All months" }].concat((DATA.summary.monthly || []).map(m => ({ id: m.month, label: m.label })));
let filter = "all";
let monthFilter = "all";
let query = "";
let catFilter = null;
let merchantFilter = null;

function fmt(n, signed) {
  const abs = Math.abs(n);
  const s = abs.toLocaleString("en-US", { style: "currency", currency: "USD" });
  if (!signed) return s;
  if (n > 0) return "+" + s;
  if (n < 0) return "−" + s;
  return s;
}
function isSpend(t) {
  // Precomputed by build.py from the canonical Python rule; fall back to the emitted rule.
  if (typeof t.household_spend === "boolean") return t.household_spend;
  if (!SPEND_RULE) return false;
  if (SPEND_RULE.exclude_types.includes(t.type)) return false;
  if (SPEND_RULE.exclude_categories.includes(t.category)) return false;
  return t.type === SPEND_RULE.type && t.amount < 0;
}
function monthName(mk) {
  if (UI.month_names && UI.month_names[mk]) return UI.month_names[mk];
  const n = Number(String(mk).slice(5, 7));
  return MONTH_ABBR[n - 1] || String(mk);
}
function isTransferish(t) {
  return t.type === "transfer" || t.type === "payment" || t.category === "Card transfer" || t.category === "Transfers";
}

function renderHero() {
  const title = UI.title || DATA.summary.title || "Fold expense tracker";
  document.title = title;
  document.getElementById("hero-eyebrow").textContent = UI.eyebrow || "Private household ledger";
  document.getElementById("hero-title").textContent = title;
  document.getElementById("hero-sub").textContent = UI.subtitle || DATA.summary.source || "";
  // hero_pills[].html is build-produced (escaped in build.py), not user input.
  document.getElementById("hero-pills").innerHTML = (UI.hero_pills || []).map(p =>
    `<div class="pill">${p.html}</div>`
  ).join("");
}

function renderFooter() {
  const lines = UI.footer_lines || DATA.summary.notes || [];
  document.getElementById("foot").innerHTML = lines.map(l => `<div>${escapeHtml(l)}</div>`).join("");
}

// Static product UX: which cards, in what order, with which value field. Hints come from the build.
const KPI_CARDS = [
  { id: "household_spend", label: "Household spend", cls: "spend" },
  { id: "credit_new_purchases", label: "Credit new purchases", cls: "spend" },
  { id: "debit_spend", label: "Debit spend", cls: "spend" },
  { id: "income_credits", label: "Income / credits", cls: "income" },
  { id: "card_transfers", label: "Card transfers", cls: "" },
  { id: "bitcoin_fold", label: "Bitcoin / Fold", cls: "gold" },
  { id: "credit_new_balance", label: "Credit new balance", cls: "gold" },
  { id: "debit_ending_balance", label: "Debit ending balance", cls: "" },
  { id: "credit_min_payment", label: "Credit min payment", cls: "" },
  { id: "credit_available_credit", label: "Available credit", cls: "income" }
];

function renderKpis() {
  const s = DATA.summary;
  const hints = UI.kpi_hints || {};
  document.getElementById("kpis").innerHTML = KPI_CARDS.map(i =>
    `<article class="card ${i.cls}"><div class="label">${escapeHtml(i.label)}</div><div class="value">${fmt(Number(s[i.id]) || 0)}</div><div class="hint">${escapeHtml(hints[i.id] || "")}</div></article>`
  ).join("");
}

function monthOk(t) {
  return monthFilter === "all" || t.date.slice(0,7) === monthFilter;
}
function monthLabel() {
  if (monthFilter === "all") return UI.period_short || "All months";
  return monthName(monthFilter) + " " + String(monthFilter).slice(0, 4);
}

function renderMonthStrip() {
  const months = DATA.summary.monthly || [];
  document.getElementById("month-strip").innerHTML = months.map(m => {
    const on = monthFilter === m.month;
    return `<button type="button" class="card" data-month="${m.month}" aria-pressed="${on}" style="min-height:88px;cursor:pointer;text-align:left;${on?"border-color:rgba(226,176,57,.55);":""}">
      <div class="label">${escapeHtml(m.label || monthName(m.month))}</div>
      <div class="value" style="font-size:22px;color:var(--neg)">${fmt(m.household_spend)}</div>
      <div class="hint">${m.household_spend_count} household · ${escapeHtml(m.note||"")}</div>
    </button>`;
  }).join("");
  document.getElementById("month-strip").onclick = (e) => {
    const b = e.target.closest("[data-month]");
    if (!b) return;
    monthFilter = monthFilter === b.dataset.month ? "all" : b.dataset.month;
    renderAll();
  };
}

function barTxns() {
  return DATA.transactions.filter(t => {
    if (!isSpend(t) || !monthOk(t)) return false;
    if (filter === "credit" && t.card !== "credit") return false;
    if (filter === "debit" && t.card !== "debit") return false;
    return true;
  });
}

function renderBars() {
  const rows = barTxns();
  const catSums = {};
  const catN = {};
  rows.forEach(t => {
    catSums[t.category] = (catSums[t.category] || 0) + (-t.amount);
    catN[t.category] = (catN[t.category] || 0) + 1;
  });
  const cats = Object.keys(catSums).map(k => ({category:k, amount:catSums[k], count:catN[k]})).sort((a,b)=>b.amount-a.amount);
  const total = cats.reduce((s,c)=>s+c.amount,0);
  document.getElementById("bars-note").textContent =
    "Household spend · " + monthLabel() + " · " + fmt(total) + " · tap a category to see merchants.";
  const drill = document.getElementById("drill");
  if (!cats.length) {
    document.getElementById("bars").innerHTML = '<p class="note">No household spend in this filter.</p>';
    drill.hidden = true;
    return;
  }
  const max = Math.max(...cats.map(c => c.amount), 1);
  document.getElementById("bars").innerHTML = cats.map(c => {
    const pct = Math.max(4, (c.amount / max) * 100);
    const on = catFilter === c.category;
    return `<button type="button" class="bar-row" data-cat="${escapeHtml(c.category)}" aria-pressed="${on}">
      <div class="bar-name">${escapeHtml(c.category)}<div class="cat">${c.count} txn${c.count===1?"":"s"}</div></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-amt">${fmt(c.amount)}</div>
    </button>`;
  }).join("");
  document.getElementById("bars").onclick = (e) => {
    const b = e.target.closest("[data-cat]");
    if (!b) return;
    const cat = b.dataset.cat;
    if (catFilter === cat) { catFilter = null; merchantFilter = null; }
    else { catFilter = cat; merchantFilter = null; }
    renderAll();
    if (catFilter) document.getElementById("drill").scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
  renderDrill(rows);
}

function renderDrill(rows) {
  const drill = document.getElementById("drill");
  if (!catFilter) {
    drill.hidden = true;
    merchantFilter = null;
    return;
  }
  const inCat = rows.filter(t => t.category === catFilter);
  const merch = {};
  const merchN = {};
  inCat.forEach(t => {
    merch[t.merchant] = (merch[t.merchant] || 0) + (-t.amount);
    merchN[t.merchant] = (merchN[t.merchant] || 0) + 1;
  });
  const list = Object.keys(merch).map(k => ({merchant:k, amount:merch[k], count:merchN[k]})).sort((a,b)=>b.amount-a.amount);
  const total = list.reduce((s,c)=>s+c.amount,0);
  drill.hidden = false;
  const crumb = merchantFilter
    ? `<button type="button" id="crumb-cat">${escapeHtml(catFilter)}</button> / ${escapeHtml(merchantFilter)}`
    : `Categories / ${escapeHtml(catFilter)}`;
  document.getElementById("drill-crumb").innerHTML = crumb;
  const crumbCat = document.getElementById("crumb-cat");
  if (crumbCat) crumbCat.onclick = () => { merchantFilter = null; renderAll(); };
  document.getElementById("drill-title").textContent = merchantFilter
    ? merchantFilter + " · " + fmt(merch[merchantFilter] || 0) + " · " + (merchN[merchantFilter] || 0) + " charges"
    : catFilter + " is " + fmt(total) + " across " + list.length + " merchant" + (list.length===1?"":"s");
  document.getElementById("drill-back").onclick = () => { catFilter = null; merchantFilter = null; renderAll(); };
  if (!list.length) {
    document.getElementById("merchant-bars").innerHTML = '<p class="note">No merchants in this slice.</p>';
    return;
  }
  const max = Math.max(...list.map(c => c.amount), 1);
  document.getElementById("merchant-bars").innerHTML = list.map(c => {
    const pct = Math.max(4, (c.amount / max) * 100);
    const on = merchantFilter === c.merchant;
    return `<button type="button" class="bar-row sub" data-merch="${escapeHtml(c.merchant)}" aria-pressed="${on}">
      <div class="bar-name">${escapeHtml(c.merchant)}<div class="cat">${c.count} txn${c.count===1?"":"s"}</div></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-amt">${fmt(c.amount)}</div>
    </button>`;
  }).join("");
  document.getElementById("merchant-bars").onclick = (e) => {
    const b = e.target.closest("[data-merch]");
    if (!b) return;
    const m = b.dataset.merch;
    merchantFilter = merchantFilter === m ? null : m;
    renderAll();
  };
}

function renderChips() {
  document.getElementById("chips").innerHTML = FILTERS.map(f =>
    `<button type="button" class="chip" data-id="${f.id}" aria-pressed="${filter===f.id}">${f.label}</button>`
  ).join("");
  document.getElementById("chips").onclick = (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    filter = b.dataset.id;
    renderAll();
  };
  document.getElementById("month-chips").innerHTML = MONTHS.map(f =>
    `<button type="button" class="chip" data-id="${escapeHtml(f.id)}" aria-pressed="${monthFilter===f.id}">${escapeHtml(f.label)}</button>`
  ).join("");
  document.getElementById("month-chips").onclick = (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    monthFilter = b.dataset.id;
    renderAll();
  };
}

function visible(t) {
  if (!monthOk(t)) return false;
  if (filter === "credit" && t.card !== "credit") return false;
  if (filter === "debit" && t.card !== "debit") return false;
  if (filter === "spend" && !isSpend(t)) return false;
  if (filter === "transfers" && !isTransferish(t)) return false;
  if (catFilter && t.category !== catFilter) return false;
  if (merchantFilter && t.merchant !== merchantFilter) return false;
  if (query) {
    const blob = (t.merchant + " " + t.description + " " + t.category + " " + t.type + " " + t.card).toLowerCase();
    if (!blob.includes(query)) return false;
  }
  return true;
}

function fmtDate(iso) {
  const p = iso.split("-");
  return MONTH_ABBR[Number(p[1])-1] + " " + Number(p[2]);
}

function renderTable() {
  const rows = DATA.transactions.filter(visible);
  document.getElementById("count").textContent = rows.length + " shown";
  document.getElementById("tbody").innerHTML = rows.map(t => {
    const cls = t.amount < 0 ? "neg" : "pos";
    return `<tr>
      <td>${fmtDate(t.date)}</td>
      <td><span class="badge ${t.card}">${t.card}</span></td>
      <td>${escapeHtml(t.merchant)}<div class="cat">${escapeHtml(t.description)}</div></td>
      <td class="cat">${escapeHtml(t.category)}</td>
      <td class="amt ${cls}">${fmt(t.amount, true)}</td>
    </tr>`;
  }).join("");
}

function renderAll() {
  renderMonthStrip();
  renderBars();
  renderChips();
  renderTable();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById("q").addEventListener("input", (e) => {
  query = e.target.value.trim().toLowerCase();
  renderTable();
});

renderHero();
renderKpis();
renderFooter();
renderAll();
</script>
</body>
</html>
